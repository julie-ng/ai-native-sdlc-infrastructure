name: Shutdown platform

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  stop-cluster:
    runs-on: ubuntu-24.04
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Stop cluster
        run: az aks stop --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME"

  stop-database:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_RESOURCE_GROUP: ${{ vars.POSTGRES_RESOURCE_GROUP }}
      POSTGRES_SERVER_NAME: ${{ vars.POSTGRES_SERVER_NAME }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Stop database
        run: az postgres flexible-server stop --resource-group "$POSTGRES_RESOURCE_GROUP" --name "$POSTGRES_SERVER_NAME"
