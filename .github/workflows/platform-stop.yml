name: Stop Platform (AKS + Postgres)

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  stop-cluster:
    runs-on: ubuntu-24.04
    environment: prod
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZ_GH_STOP_PLATFORM_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
      - name: Stop AKS cluster
        run: |
          az aks stop \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME"

  stop-database:
    runs-on: ubuntu-24.04
    environment: prod
    env:
      AZ_POSTGRES_RESOURCE_GROUP: ${{ vars.AZ_POSTGRES_RESOURCE_GROUP }}
      AZ_POSTGRES_SERVER_NAME: ${{ vars.AZ_POSTGRES_SERVER_NAME }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZ_GH_STOP_PLATFORM_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
      - name: Stop Postgres Server
        run: |
          az postgres flexible-server stop \
            --resource-group "$AZ_POSTGRES_RESOURCE_GROUP" \
            --name "$AZ_POSTGRES_SERVER_NAME"
